<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09031d" />
    <meta name="description" content="A neon animated flower bouquet, drawn by shooting stars." />
    <title>Neon Bloom</title>
  </head>
  <body>
    <main class="stage">
      <canvas id="bouquet" aria-label="Animated neon flower bouquet"></canvas>
      <div class="halo"></div>
      <div class="copy">
        <p class="eyebrow">A little starlight for you</p>
        <h1><span>Neon</span> Bloom</h1>
      </div>
      <button id="replay" type="button" aria-label="Replay animation">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 1 1-2.34-5.66M20 3v8h-8"/>
        </svg>
        Replay
      </button>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
